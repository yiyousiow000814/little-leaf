name: Static ground and wall viewport sensitivity, exact #397 only
on:
  push:
    branches: [qa/render-mechanism-397]
permissions:
  contents: read
concurrency:
  group: render-mechanism-397
  cancel-in-progress: false
jobs:
  only-candidate:
    if: >-
      github.repository == 'yiyousiow000814/little-leaf' && github.actor == 'yiyousiow000814' &&
      github.run_attempt == '1' && github.ref == 'refs/heads/qa/render-mechanism-397' &&
      github.event_name == 'push' && !github.event.created && !github.event.deleted && !github.event.forced &&
      github.event.before == 'ce1435afb2329a6c1d2d77a8a19923dfd96bd205'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KIT: tools/diagnostics/render-mechanism-397
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read single diagnostic head and direct parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: tools/diagnostics/render-mechanism-397
          persist-credentials: false
      - name: Gate source and diagnostic-only changes
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 "$KIT/guard.py" fail "$RUNNER_TEMP/ll-render-mechanism-397-public/summary.json" source_binding
          python3 "$KIT/guard.py" event .
      - name: Read the exact candidate, no original checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce1435afb2329a6c1d2d77a8a19923dfd96bd205
          path: product
          fetch-depth: 1
          sparse-checkout: |
            game
            tools/ci
          persist-credentials: false
      - name: Import static source, then one isolated six-arm diagnostic
        timeout-minutes: 10
        run: bash "$KIT/run.sh"
      - name: Publish only the bounded aggregate or safe failure stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-mechanism-397-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ll-render-mechanism-397-public/summary.json
          if-no-files-found: warn
          retention-days: 14
