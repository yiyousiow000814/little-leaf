name: Measure native startup cold and warm atlases
on:
  pull_request:
    paths:
      - '.github/workflows/startup-profile.yml'
      - 'qa/profile_startup_transition.gd'
      - 'qa/run_startup_profile.py'
      - 'qa/STARTUP_PROFILING.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startup-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing checksum-pinned official engine
        run: python3 ci/install_tools.py godot --output "$RUNNER_TEMP/startup-tools"
      - name: Prepare Ubuntu native software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Measure two isolated cold and retained-warm pairs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 qa/run_startup_profile.py --expected-head "$EXPECTED_HEAD" --import-project --output "$RUNNER_TEMP/startup-profile/pair-1"
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 qa/run_startup_profile.py --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/startup-profile/pair-2"
      - name: Retain source receipts and raw rendered intervals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-native-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/startup-profile/
          if-no-files-found: error
          retention-days: 7
