          sys.path.insert(0,'tools')
          from build.build_itch_trusted_preview import prepare_stable
          git=lambda key:subprocess.check_output(['git','rev-parse',key],text=True).strip()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          prepare_stable(root/'web-build',root/'itch-test-preflight',json.loads(pathlib.Path('platform/firebase/public-config.json').read_text()),git('HEAD'),git('HEAD^{tree}'))
          PY
          fi
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd platform/firebase
          test_args=''
          if [[ '${{ inputs.itch_test_entry }}' == true ]]; then test_args="--itch-test-variant '$RUNNER_TEMP/itch-test-preflight'"; fi
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-little-leaf "xvfb-run -a node fullflow.test.mjs --web-build '$RUNNER_TEMP/web-build/web' --output '$RUNNER_TEMP/web-build/evidence/firebase-fullflow' --engine-report '$RUNNER_TEMP/engine-evidence/summary.json' $test_args"
      - name: Stage Firebase only from this exact fresh all-gates build
        if: inputs.firebase_preview
        id: firebase_prepare
        env:
          PUBLICATION_RECEIPT: ${{ inputs.publication_receipt }}
        run: |
          preview_args=()
          if [[ '${{ inputs.itch_preview }}' == 'true' ]]; then preview_args=(--itch-preview-bootstrap); fi
          if [[ '${{ inputs.itch_test_entry }}' == true ]]; then
            test '${{ inputs.itch_preview }}' != true
            test -z "$PUBLICATION_RECEIPT"
            preview_args=(--itch-test-entry)
          fi
          if [[ -n "$PUBLICATION_RECEIPT" ]]; then
            test '${{ inputs.itch_preview }}' != true
            python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"publication.json").write_text(json.dumps(json.loads(os.environ["PUBLICATION_RECEIPT"])))'
            preview_args+=(--publication-receipt "$RUNNER_TEMP/publication.json")
          fi
          python3 tools/build/build_firebase.py --validated-web-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/firebase-variant" --public-config platform/firebase/public-config.json --require-fresh-ci --engine-report "$RUNNER_TEMP/engine-evidence/summary.json" --focused-logs "$RUNNER_TEMP/firebase-focused" "${preview_args[@]}"
      - name: Retain the fresh tested Firebase preview without publication
        if: inputs.firebase_preview
        id: firebase_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.firebase_prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/firebase-variant/
          if-no-files-found: error
          retention-days: 7
      - name: Record fresh preview handoff
        if: inputs.firebase_preview
        env:
          ARTIFACT_ID: ${{ steps.firebase_upload.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ steps.firebase_prepare.outputs.manifest_sha256 }}
        run: |
          printf 'Fresh source: %s\nRun: %s\nArtifact ID: %s\nManifest SHA256: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
          printf 'All existing native/export/browser gates and focused Firebase/emulator checks passed in this run. No historical CI artifact reuse, deployment, or hosted/device acceptance is claimed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test and export evidence (never profiles or credentials)
        if: always() && needs.guard.outputs.scope != 'lightweight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-firebase-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-evidence/*.json
            ${{ runner.temp }}/engine-evidence/*.log
            ${{ runner.temp }}/web-build/evidence/
            ${{ runner.temp }}/crazygames-build/evidence/
            ${{ runner.temp }}/old-engine-evidence/*.json
            ${{ runner.temp }}/old-engine-evidence/*.log
            ${{ runner.temp }}/old-web-build/evidence/
            ${{ runner.temp }}/firebase-focused/
          if-no-files-found: warn
          retention-days: 7
  gate:
    if: always()
    needs: [guard, preflight, engine, historical, build, crazygames, play, browser, compatibility, firebase]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.accept.outputs.artifact_id }}
      firebase_artifact_id: ${{ steps.accept.outputs.firebase_artifact_id }}
      firebase_manifest_sha256: ${{ steps.accept.outputs.firebase_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/rendering/wall_compatibility_parallel.js
            /tests/rendering/wall_compatibility_helpers.js
            /tests/tooling/source_paths.js
            /tools/ci/pr_ci_scope.py
            /tools/ci/pr_gate_inputs.py
            /tools/ci/crazygames_pr_evidence.py
      - name: Require the route-correct complete preflight
        env:
          CI_SCOPE: ${{ needs.guard.outputs.scope }}
          ORDINARY_PR: ${{ needs.guard.outputs.ordinary_pr }}
          INLINE_PREFLIGHT: ${{ needs.guard.outputs.inline_preflight }}
          PREFLIGHT: ${{ needs.preflight.result }}
          PREFLIGHT_BINDING: ${{ needs.preflight.outputs.binding }}
        run: python3 tools/ci/pr_ci_scope.py --check-preflight-join
      - name: Require numeric current compact archive ID distinct from the full archive
        id: current_compact_id
        if: always() && needs.build.result == 'success' && needs.guard.outputs.ordinary_pr == 'true'
        env:
          COMPACT_ID: ${{ needs.build.outputs.compact_id }}
          FULL_ID: ${{ needs.build.outputs.inputs_id }}
        run: '[[ "$COMPACT_ID" =~ ^[1-9][0-9]*$ && "$COMPACT_ID" != "$FULL_ID" ]]'
      - name: Collect exact current compact gate inputs
        if: always() && needs.build.result == 'success' && needs.guard.outputs.ordinary_pr == 'true' && steps.current_compact_id.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.compact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Verify compact current evidence before browser evidence joins
        if: always() && needs.build.result == 'success' && needs.guard.outputs.ordinary_pr == 'true'
        env:
          FULL_ARTIFACT_ID: ${{ needs.build.outputs.inputs_id }}
          FULL_ARTIFACT_DIGEST: ${{ needs.build.outputs.inputs_digest }}
        run: python3 tools/ci/pr_gate_inputs.py verify current "$RUNNER_TEMP"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.build.result == 'success' && needs.guard.outputs.ordinary_pr != 'true'
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.build.result == 'success' && (needs.play.result != 'skipped' || needs.browser.result != 'skipped')
        with:
          pattern: little-leaf-browser-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Require numeric historical compact archive ID distinct from the full archive
        id: historical_compact_id
        if: always() && needs.historical.result == 'success' && needs.guard.outputs.ordinary_pr == 'true'
        env:
          COMPACT_ID: ${{ needs.historical.outputs.compact_id }}
          FULL_ID: ${{ needs.historical.outputs.inputs_id }}
        run: '[[ "$COMPACT_ID" =~ ^[1-9][0-9]*$ && "$COMPACT_ID" != "$FULL_ID" ]]'
      - name: Collect exact historical compact gate inputs
        if: always() && needs.historical.result == 'success' && needs.guard.outputs.ordinary_pr == 'true' && steps.historical_compact_id.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.historical.outputs.compact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Verify compact historical evidence before browser evidence joins
        if: always() && needs.historical.result == 'success' && needs.guard.outputs.ordinary_pr == 'true'
        env:
          FULL_ARTIFACT_ID: ${{ needs.historical.outputs.inputs_id }}
          FULL_ARTIFACT_DIGEST: ${{ needs.historical.outputs.inputs_digest }}
        run: python3 tools/ci/pr_gate_inputs.py verify historical "$RUNNER_TEMP"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.historical.result == 'success' && needs.guard.outputs.ordinary_pr != 'true'
        with:
          name: little-leaf-historical-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always() && needs.firebase.result == 'success'
        with:
          name: little-leaf-firebase-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Collect the exact sibling evidence artifact, without name matching
        if: always() && needs.crazygames.outputs.evidence_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.crazygames.outputs.evidence_id }}
          path: ${{ runner.temp }}/crazygames-build/evidence
          merge-multiple: true
          digest-mismatch: error
      - name: Verify the sibling receipt and eight original stage logs before archiving
        id: sibling_verify
        if: needs.guard.outputs.locked_browser == 'true' && needs.guard.outputs.scope == 'full'
        env:
          CI_ORDINARY_MAIN_VARIANT: ${{ needs.guard.outputs.locked_browser }}
          VARIANT_ID: ${{ needs.crazygames.outputs.artifact_id }}
          CI_INPUTS_ID: ${{ needs.build.outputs.inputs_id }}
        run: python3 tools/ci/crazygames_pr_evidence.py verify --root "$RUNNER_TEMP"
      - name: Require both bound compatibility case receipts
        if: needs.build.result == 'success' && needs.compatibility.result == 'success'
        run: node tests/rendering/wall_compatibility_parallel.js --merge "$RUNNER_TEMP/web-build/evidence/wall-browser"
      - name: Keep test and export evidence (never profiles or credentials)
        id: gate_evidence
        if: always() && needs.guard.outputs.scope != 'lightweight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-evidence/*.json
            ${{ runner.temp }}/engine-evidence/*.log
            ${{ runner.temp }}/web-build/evidence/
            ${{ runner.temp }}/crazygames-build/evidence/
            ${{ runner.temp }}/old-engine-evidence/*.json
            ${{ runner.temp }}/old-engine-evidence/*.log
            ${{ runner.temp }}/old-web-build/evidence/
            ${{ runner.temp }}/firebase-focused/
          if-no-files-found: warn
          retention-days: 7

      - name: Accept explicitly limited PR guard result
        if: needs.guard.outputs.scope == 'lightweight'
        env:
          CI_SCOPE: ${{ needs.guard.outputs.scope }}
          FIREBASE_PREVIEW: ${{ inputs.firebase_preview }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ITCH_PREVIEW: ${{ inputs.itch_preview }}
          GUARD: ${{ needs.guard.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          ENGINE: ${{ needs.engine.result }}
          HISTORICAL: ${{ needs.historical.result }}
          BUILD: ${{ needs.build.result }}
          CRAZYGAMES: ${{ needs.crazygames.result }}
          CRAZYGAMES_ARTIFACT: ${{ needs.crazygames.outputs.artifact_id }}
          CRAZYGAMES_EVIDENCE: ${{ needs.crazygames.outputs.evidence_id }}
          PLAY: ${{ needs.play.result }}
          BROWSER: ${{ needs.browser.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          FIREBASE: ${{ needs.firebase.result }}
          FIREBASE_REQUIRED: ${{ inputs.firebase_preview }}
          WEB_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
          FIREBASE_ARTIFACT: ${{ needs.firebase.outputs.artifact_id }}
          FIREBASE_MANIFEST: ${{ needs.firebase.outputs.manifest_sha256 }}
        run: python3 tools/ci/pr_ci_scope.py --check-lightweight-gate
      - name: Require every mandatory gate before exposing release outputs
        id: accept
        if: needs.guard.outputs.scope != 'lightweight'
        env:
          SIBLING_REQUIRED: ${{ needs.guard.outputs.locked_browser }}
          GATE_EVIDENCE: ${{ steps.gate_evidence.outputs.artifact-id }}
          SIBLING_VERIFIED: ${{ steps.sibling_verify.outcome }}
          GUARD: ${{ needs.guard.result }}
          ENGINE: ${{ needs.engine.result }}
          HISTORICAL: ${{ needs.historical.result }}
          BUILD: ${{ needs.build.result }}
          CRAZYGAMES: ${{ needs.crazygames.result }}
          CRAZYGAMES_ARTIFACT: ${{ needs.crazygames.outputs.artifact_id }}
          CRAZYGAMES_EVIDENCE: ${{ needs.crazygames.outputs.evidence_id }}
          PLAY: ${{ needs.play.result }}
          BROWSER: ${{ needs.browser.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          FIREBASE: ${{ needs.firebase.result }}
          FIREBASE_REQUIRED: ${{ inputs.firebase_preview }}
          WEB_ARTIFACT: ${{ needs.build.outputs.artifact_id }}
          FIREBASE_ARTIFACT: ${{ needs.firebase.outputs.artifact_id }}
          FIREBASE_MANIFEST: ${{ needs.firebase.outputs.manifest_sha256 }}
        run: |
          for result in "$GUARD" "$ENGINE" "$HISTORICAL" "$BUILD" "$PLAY" "$BROWSER" "$COMPATIBILITY"; do test "$result" = success || exit 1; done
          if [ "$FIREBASE_REQUIRED" = true ]; then test "$FIREBASE" = success && test -n "$FIREBASE_ARTIFACT" && test -n "$FIREBASE_MANIFEST" || exit 1; else test "$FIREBASE" = skipped || exit 1; fi
          case "$SIBLING_REQUIRED" in
            true) test "$CRAZYGAMES" = success && test "$SIBLING_VERIFIED" = success && test -n "$CRAZYGAMES_ARTIFACT" && test -n "$CRAZYGAMES_EVIDENCE" && test -n "$GATE_EVIDENCE" || exit 1 ;;
            false) test "$CRAZYGAMES" = skipped && test -z "$CRAZYGAMES_ARTIFACT$CRAZYGAMES_EVIDENCE" || exit 1 ;;
            *) exit 1 ;;
          esac
          test -n "$WEB_ARTIFACT"
          echo "artifact_id=$WEB_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "firebase_artifact_id=$FIREBASE_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "firebase_manifest_sha256=$FIREBASE_MANIFEST" >> "$GITHUB_OUTPUT"
