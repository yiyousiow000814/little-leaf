name: Reusable Web build
on:
  workflow_call:
    inputs:
      release_tag:
        description: Empty for CI; exact version tag for release verification
        type: string
        default: ''
      firebase_preview:
        description: Stage Firebase from this complete fresh run; never deploy
        type: boolean
        default: false
      itch_preview:
        description: Prepare trusted-frame bootstrap after the unchanged fresh Firebase gates
        type: boolean
        default: false
      itch_test_entry:
        description: Qualify the fixed stable /itch iframe using the same complete Firebase gates
        type: boolean
        default: false
      publication_receipt:
        description: Exact completed receipt selected by the read-only Firebase coordinator
        type: string
        default: ''
    outputs:
      artifact_id:
        description: Exact artifact from this tested source
        value: ${{ jobs.gate.outputs.artifact_id }}
      firebase_artifact_id:
        description: Same-run Firebase preview after all gates passed
        value: ${{ jobs.gate.outputs.firebase_artifact_id }}
      firebase_manifest_sha256:
        description: Exact newly generated Firebase manifest hash
        value: ${{ jobs.gate.outputs.firebase_manifest_sha256 }}
permissions:
  contents: read
jobs:
  guard:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.event_name == 'push' && github.ref == 'refs/heads/qa/main-10min-ci-407-stability2-optimized' && github.event.created && !github.event.deleted && github.run_attempt == 1 && inputs.release_tag == '' && !inputs.firebase_preview && !inputs.itch_preview && !inputs.itch_test_entry && inputs.publication_receipt == ''
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      ordinary_pr: ${{ steps.engine_plan.outputs.ordinary_pr }}
      inline_preflight: ${{ steps.inline_preflight.outcome }}
      locked_browser: ${{ steps.engine_plan.outputs.locked_browser }}
      engine_count: ${{ steps.engine_plan.outputs.count }}
      engine_matrix: ${{ steps.engine_plan.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the verified PR merge-tree diff (uncertainty runs full CI)
        id: scope
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          FIREBASE_PREVIEW: ${{ inputs.firebase_preview }}
          ITCH_PREVIEW: ${{ inputs.itch_preview }}
          ITCH_TEST_ENTRY: ${{ inputs.itch_test_entry }}
          PUBLICATION_RECEIPT: ${{ inputs.publication_receipt }}
        run: |
          if [[ "$ITCH_TEST_ENTRY" == true ]]; then
            test "$FIREBASE_PREVIEW" = true
            test "$ITCH_PREVIEW" = false
            test -z "$PUBLICATION_RECEIPT"
            test -z "$RELEASE_TAG"
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_RUN_ATTEMPT" = 1
          fi
          python3 tools/ci/pr_ci_scope.py
      - name: Select ordinary PR scope and native-engine fanout
        id: engine_plan
        env:
          ORDINARY_PR: ${{ github.event_name == 'pull_request' && inputs.release_tag == '' && !inputs.firebase_preview && !inputs.itch_preview && !inputs.itch_test_entry && inputs.publication_receipt == '' }}
          LOCKED_BROWSER: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/qa/main-10min-ci-407-stability2-optimized')) && inputs.release_tag == '' && !inputs.firebase_preview && !inputs.itch_preview && !inputs.itch_test_entry && inputs.publication_receipt == '' }}
        run: |
          case "$ORDINARY_PR" in true|false) ;; *) exit 1 ;; esac
          case "$LOCKED_BROWSER" in
            true) count=9; matrix='[0,1,2,3,4,5,6,7,8]' ;;
            false) count=5; matrix='[0,1,2,3,4]' ;;
            *) echo "Unrecognized engine fanout route" >&2; exit 1 ;;
          esac
          printf 'count=%s\nmatrix=%s\n' "$count" "$matrix" >> "$GITHUB_OUTPUT"
          printf 'ordinary_pr=%s\nlocked_browser=%s\n' "$ORDINARY_PR" "$LOCKED_BROWSER" >> "$GITHUB_OUTPUT"
      - name: Verify metadata and CI guard tests
        id: inline_preflight
        if: steps.scope.outputs.scope != 'full' || steps.engine_plan.outputs.ordinary_pr != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/ci/preflight.py
  preflight:
    needs: guard
    if: needs.guard.outputs.scope == 'full' && needs.guard.outputs.ordinary_pr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      binding: ${{ steps.bind.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify metadata and CI guard tests
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/ci/preflight.py
      - name: Bind successful complete preflight to this exact PR merge and attempt
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'binding=%s:%s:%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  browser_packages:
    needs: guard
    if: needs.guard.outputs.scope == 'full' && needs.guard.outputs.locked_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      binding: ${{ steps.bind.outputs.binding }}
      browser_packages_id: ${{ steps.browser_packages.outcome == 'success' && steps.browser_packages.outputs.artifact-id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prefetch verified Chromium dependencies during native tests
        id: prefetch_browser_packages
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 tools/ci/play_provision.py prefetch "$RUNNER_TEMP/pinned-chromium-prefetch"
          if compgen -G "$RUNNER_TEMP/pinned-chromium-prefetch/*.deb" > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain verified browser dependency bytes for this attempt
        id: browser_packages
        timeout-minutes: 1
        if: steps.prefetch_browser_packages.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-pinned-chromium-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinned-chromium-prefetch/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Bind anticipatory browser packages to this source and attempt
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'binding=%s:%s:%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  engine:
    if: needs.guard.outputs.scope != 'lightweight'
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.guard.outputs.engine_count) }}
      matrix:
        shard: ${{ fromJSON(needs.guard.outputs.engine_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned Godot for native tests
        run: python3 tools/ci/install_tools.py godot --native-only --output "$RUNNER_TEMP/godot-tools"
      - name: Run balanced complete engine shard
        env:
          ENGINE_COUNT: ${{ needs.guard.outputs.engine_count }}
        run: python3 tools/ci/engine_shards.py run --shard ${{ matrix.shard }} --count "$ENGINE_COUNT" --output "$RUNNER_TEMP/engine-${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: little-leaf-engine-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-${{ matrix.shard }}/*.json
            ${{ runner.temp }}/engine-${{ matrix.shard }}/*.log
          if-no-files-found: warn
          retention-days: 7
  historical:
    if: needs.guard.outputs.scope != 'lightweight'
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
      inputs_digest: ${{ steps.inputs.outputs.artifact-digest }}
      compact_id: ${{ steps.compact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Godot and official Web template
        run: python3 tools/ci/install_tools.py godot --output "$RUNNER_TEMP/godot-tools"
      - name: Check out the exact historical wall-format-1 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9110ebd9a2d6cbf4d2af303be0e244e660c0f7fc
          path: .compatibility-old
          persist-credentials: false
      - name: Test and export the unchanged historical client once
        run: |
          test "$(git -C .compatibility-old rev-parse HEAD)" = 9110ebd9a2d6cbf4d2af303be0e244e660c0f7fc
          cmp tools/ci/toolchain.json .compatibility-old/ci/toolchain.json
          python3 .compatibility-old/tests/run_integration_candidate.py --output "$RUNNER_TEMP/old-engine-evidence" --lock "$RUNNER_TEMP/old-engine.lock"
          python3 .compatibility-old/ci/build_web.py --output "$RUNNER_TEMP/old-web-build" --test-report "$RUNNER_TEMP/old-engine-evidence/summary.json"
      - name: Prepare the exact historical native layout once
        run: python3 tools/qualification/prepare_browser_qa.py wall --prepare-side old --old-source .compatibility-old --old-build "$RUNNER_TEMP/old-web-build" --output "$RUNNER_TEMP/old-web-build/evidence/wall-layout"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: inputs
        if: always()
        with:
          name: little-leaf-historical-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/old-engine-evidence/*.json
            ${{ runner.temp }}/old-engine-evidence/*.log
            ${{ runner.temp }}/old-web-build/web/
            ${{ runner.temp }}/old-web-build/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Bind compact historical gate inputs to the full archive
        if: needs.guard.outputs.ordinary_pr == 'true'
        env:
          FULL_ARTIFACT_ID: ${{ steps.inputs.outputs.artifact-id }}
          FULL_ARTIFACT_DIGEST: ${{ steps.inputs.outputs.artifact-digest }}
        run: python3 tools/ci/pr_gate_inputs.py record historical "$RUNNER_TEMP"
      - name: Retain compact historical gate inputs (no packed game)
        id: compact
        if: needs.guard.outputs.ordinary_pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-pr-gate-historical-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/old-engine-evidence/*.json
            ${{ runner.temp }}/old-engine-evidence/*.log
            ${{ runner.temp }}/old-web-build/web/release-manifest.json
            ${{ runner.temp }}/old-web-build/evidence/
            ${{ runner.temp }}/pr-gate-historical.json
          if-no-files-found: error
          retention-days: 7
  build:
    # A deliberately skipped optional route must not suppress the original path.
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.engine.result == 'success' && needs.guard.outputs.scope == 'full' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') && (needs.browser_packages.result == 'success' || needs.browser_packages.result == 'skipped') }}
    needs: [guard, preflight, engine, browser_packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      locked_browser: ${{ needs.guard.outputs.locked_browser }}
      browser_packages_id: ${{ needs.browser_packages.outputs.browser_packages_id }}
      browser_packages_binding: ${{ needs.browser_packages.outputs.binding }}
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
      inputs_digest: ${{ steps.inputs.outputs.artifact-digest }}
      compact_id: ${{ steps.compact.outputs.artifact-id }}
    env:
      # These source score archives are not inputs to Web export or live Play proof.
      ARCHIVE_FREE_CHECKOUT: |
        /*
        !/docs/art-audio/scores/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ needs.guard.outputs.ordinary_pr == 'true' && env.ARCHIVE_FREE_CHECKOUT || '' }}
      - name: Require the route-correct complete preflight
        env:
          CI_SCOPE: ${{ needs.guard.outputs.scope }}
          ORDINARY_PR: ${{ needs.guard.outputs.ordinary_pr }}
          INLINE_PREFLIGHT: ${{ needs.guard.outputs.inline_preflight }}
          PREFLIGHT: ${{ needs.preflight.result }}
          PREFLIGHT_BINDING: ${{ needs.preflight.outputs.binding }}
        run: python3 tools/ci/pr_ci_scope.py --check-preflight-join
      - name: Require the current exact browser preparation attempt
        if: needs.guard.outputs.locked_browser == 'true'
        env:
          PACKAGE_BINDING: ${{ needs.browser_packages.outputs.binding }}
        run: test "$PACKAGE_BINDING" = "$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - name: Install checksum-pinned Godot and official Web template
        run: python3 tools/ci/install_tools.py godot --output "$RUNNER_TEMP/godot-tools"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: little-leaf-engine-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-shards
          merge-multiple: false
          digest-mismatch: error
      - name: Require all same-source shards and merge complete engine evidence
        env:
          ENGINE_COUNT: ${{ needs.guard.outputs.engine_count }}
        run: python3 tools/ci/engine_shards.py merge --count "$ENGINE_COUNT" --reports "$RUNNER_TEMP/engine-shards" --output "$RUNNER_TEMP/engine-evidence"
      - name: Export exact source and verify packed resources
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/build/build_web.py --output "$RUNNER_TEMP/web-build" --test-report "$RUNNER_TEMP/engine-evidence/summary.json" --tag "$RELEASE_TAG"
      - name: Prepare the exact candidate native layout once
        run: python3 tools/qualification/prepare_browser_qa.py wall --prepare-side new --new-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/web-build/evidence/wall-layout"
      - name: Bind exact post-import staging metadata for the CI variant sibling
        if: needs.guard.outputs.locked_browser == 'true'
        env:
          CI_ORDINARY_MAIN_VARIANT: ${{ needs.guard.outputs.locked_browser }}
        run: python3 tools/build/crazygames_stage_handoff.py pack --web-build "$RUNNER_TEMP/web-build" --packet "$RUNNER_TEMP/crazygames-stage.json"
      - name: Export separate CrazyGames variant after the unchanged complete Web gate
        if: needs.guard.outputs.locked_browser == 'false'
        run: python3 tools/build/build_crazygames.py --validated-web-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/crazygames-build"
      - name: Retain separate CrazyGames export for review
        if: needs.guard.outputs.locked_browser == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-crazygames-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crazygames-build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Retain engine-tested Web export before browser validation
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-web-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-build/web/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: inputs
        if: always()
        with:
          name: little-leaf-ci-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-evidence/
            ${{ runner.temp }}/web-build/web/
            ${{ runner.temp }}/web-build/evidence/
            ${{ runner.temp }}/crazygames-build/evidence/
            ${{ runner.temp }}/crazygames-stage.json
          if-no-files-found: error
          retention-days: 7
      - name: Bind compact current gate inputs to the full archive
        if: needs.guard.outputs.ordinary_pr == 'true'
        env:
          FULL_ARTIFACT_ID: ${{ steps.inputs.outputs.artifact-id }}
          FULL_ARTIFACT_DIGEST: ${{ steps.inputs.outputs.artifact-digest }}
        run: python3 tools/ci/pr_gate_inputs.py record current "$RUNNER_TEMP"
      - name: Retain compact current gate inputs (no packed game)
        id: compact
        if: needs.guard.outputs.ordinary_pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-pr-gate-current-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-evidence/*.json
            ${{ runner.temp }}/engine-evidence/*.log
            ${{ runner.temp }}/web-build/web/release-manifest.json
            ${{ runner.temp }}/web-build/evidence/
            ${{ runner.temp }}/crazygames-stage.json
            ${{ runner.temp }}/pr-gate-current.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.firebase_preview
        with:
          name: little-leaf-candidate-project-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/web-build/project/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  crazygames:
    name: ${{ needs.guard.outputs.ordinary_pr == 'false' && needs.guard.outputs.locked_browser == 'true' && 'crazygames (main CI)' || 'crazygames' }}
    needs: [guard, build]
    # Main intentionally skips the PR-only preflight; accept only proven direct dependencies.
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.build.result == 'success' && needs.guard.outputs.scope == 'full' && needs.guard.outputs.locked_browser == 'true' }}
    env:
      CI_ORDINARY_MAIN_VARIANT: ${{ needs.guard.outputs.locked_browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.variant.outputs.artifact-id }}
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install checksum-pinned Godot and official Web template
        run: python3 tools/ci/install_tools.py godot --output "$RUNNER_TEMP/godot-tools"
      - name: Require immutable ID from the ordinary build
        env:
          CI_INPUTS_ID: ${{ needs.build.outputs.inputs_id }}
        run: '[[ "$CI_INPUTS_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Restore and verify the exact ordinary post-import stage
        run: python3 tools/build/crazygames_stage_handoff.py restore --web-build "$RUNNER_TEMP/web-build" --packet "$RUNNER_TEMP/crazygames-stage.json"
      - name: Export the independent CI variant through all original stages
        run: python3 tools/build/build_crazygames.py --validated-web-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/crazygames-build"
      - name: Retain the original variant ZIP for review
        id: variant
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-crazygames-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crazygames-build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Bind variant upload and original eight stage logs
        env:
          VARIANT_ID: ${{ steps.variant.outputs.artifact-id }}
          CI_INPUTS_ID: ${{ needs.build.outputs.inputs_id }}
        run: python3 tools/ci/crazygames_pr_evidence.py record --root "$RUNNER_TEMP"
      - name: Retain variant evidence, including partial logs on a failure
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-crazygames-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crazygames-build/evidence/
          if-no-files-found: warn
          retention-days: 7
  play:
    name: browser (play)
    # The PR-only preflight is a deliberately skipped ancestor on non-PR routes.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # These source score archives are not inputs to Web export or live Play proof.
      ARCHIVE_FREE_CHECKOUT: |
        /*
        !/docs/art-audio/scores/
      ORDINARY_PR: ${{ github.event_name == 'pull_request' && inputs.release_tag == '' && !inputs.firebase_preview && !inputs.itch_preview && !inputs.itch_test_entry && inputs.publication_receipt == '' }}
      LOCKED_BROWSER_PROVISION: ${{ needs.build.outputs.locked_browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.ORDINARY_PR == 'true' && env.ARCHIVE_FREE_CHECKOUT || '' }}
      - name: Install shared pinned browser tools
        if: env.LOCKED_BROWSER_PROVISION != 'true'
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/inbox-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/inbox-browser-tools/node_modules/.bin/playwright" install-deps chromium
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          google-chrome --version
      - name: Restore exact-attempt verified Chromium package bytes
        if: env.LOCKED_BROWSER_PROVISION == 'true' && needs.build.outputs.browser_packages_id != '' && needs.build.outputs.browser_packages_binding == format('{0}:{1}:{2}', github.sha, github.run_id, github.run_attempt)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.browser_packages_id }}
          path: ${{ runner.temp }}/pinned-chromium-packages
          merge-multiple: true
          digest-mismatch: error
      - name: Install only missing pinned Ubuntu packages and pinned Playwright for Play
        if: env.LOCKED_BROWSER_PROVISION == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          # npm writes only to the private driver prefix, while the OS installer owns dpkg.
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-provision"
          timeout --kill-after=5s 170s npm install --prefix "$RUNNER_TEMP/inbox-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0 &
          driver_pid=$!
          timeout --kill-after=5s 170s python3 tools/ci/play_provision.py candidate "$RUNNER_TEMP/play-provision/package-transaction.json" "$RUNNER_TEMP/pinned-chromium-packages" &
          packages_pid=$!
          trap 'kill "$driver_pid" "$packages_pid" 2>/dev/null || true; wait || true; exit 130' INT
          trap 'kill "$driver_pid" "$packages_pid" 2>/dev/null || true; wait || true; exit 143' TERM
          driver_status=0
          packages_status=0
          wait "$driver_pid" || driver_status=$?
          wait "$packages_pid" || packages_status=$?
          trap - INT TERM
          if (( driver_status != 0 || packages_status != 0 )); then
            printf 'Play provision failed: driver=%s packages=%s\n' "$driver_status" "$packages_status" >&2
            exit 1
          fi
      - name: Install exact checksum-pinned Chrome for ordinary browser gates
        run: python3 tools/ci/install_tools.py chrome --output "$RUNNER_TEMP/chrome-tools"
      - name: Activate and verify the pinned Chrome channel
        run: |
