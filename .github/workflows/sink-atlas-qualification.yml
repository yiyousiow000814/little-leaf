name: Qualify sink atlas dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/sink-atlas-qualification.yml'
      - 'tests/diagnostics/sink_atlas/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sink-atlas-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  canonical-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing checksum-pinned official engine
        run: python3 tools/install_tools.py godot --output "$RUNNER_TEMP/sink-tools"
      - name: Prepare canonical native renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0
      - name: Qualify three atlases without changing assets or manifest
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tests/diagnostics/sink_atlas/run.py --godot "$RUNNER_TEMP/sink-tools/godot" --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/sink-atlas"
      - name: Preserve exact source and RGBA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sink-atlas-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sink-atlas/
          if-no-files-found: error
          retention-days: 7
