name: Verify stove atlas acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stove-atlas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned official Godot
        run: python3 tools/install_tools.py godot --output "$RUNNER_TEMP/stove-tools"
      - name: Install canonical software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri=25.2.8-0ubuntu0.24.04.4 libglx-mesa0=25.2.8-0ubuntu0.24.04.4
      - name: Compare exact baseline, candidate and checked-in RGBA
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 tests/diagnostics/stove_atlas/run.py
      - name: Retain exact-source parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stove-atlas-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stove-atlas/atlas-parity.json
            ${{ runner.temp }}/stove-atlas/*-receipt.json
            ${{ runner.temp }}/stove-atlas/*/*.log
            ${{ runner.temp }}/stove-atlas/*/source/game/native-*-atlas.png
            ${{ runner.temp }}/stove-tools/toolchain-receipt.json
          if-no-files-found: error
          retention-days: 7
