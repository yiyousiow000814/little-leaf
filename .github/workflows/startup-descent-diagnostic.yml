name: Compare opaque startup warm-up and descent
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: startup-descent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/readiness-descent-10a'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: df115a085437633e3538ef5462401f57739fc935
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 456a9168c4942e08dfa36870a39771cec4b0e58b
          persist-credentials: false
          path: candidate
      - name: Verify immutable production and diagnostic contracts
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD^{tree})" = b30fb0c6b53e48a53d1e7f3b63628dd0ff8dd872
          test "$(git -C candidate rev-parse HEAD^{tree})" = b0f0046a165504dc6d8acd5b45743c4b9345a0b6
          python3 -m unittest discover -s tests/startup_descent -p 'test_*.py' -v
          node tests/startup_descent/test_validate.js
          for root in baseline candidate; do
            (cd "$root" && python3 ci/verify_prebaked_atlases.py)
            mkdir -p "$root/qa"
            cp -R qa/startup_descent "$root/qa/startup_descent"
          done
          git diff --exit-code
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
      - name: Install checksum-pinned official engine and Web template
        run: python3 ci/install_tools.py godot --output "$RUNNER_TEMP/descent-tools"
      - name: Export symmetric fresh diagnostic and empty-subclass controls
        run: |
          set -euo pipefail
          for product in baseline candidate; do
            expected=df115a085437633e3538ef5462401f57739fc935
            if [ "$product" = candidate ]; then expected=456a9168c4942e08dfa36870a39771cec4b0e58b; fi
            python3 qa/startup_descent/prepare.py --source-root "$PWD/$product" --expected-source "$expected" \
              --output "$RUNNER_TEMP/descent-$product" --export \
              --engine-lock "$RUNNER_TEMP/descent-engine.lock" \
              --godot "${GODOT_BIN:-godot}" --template "$GODOT_TEMPLATE" \
              --toolchain-receipt "$GODOT_TOOLCHAIN_RECEIPT"
          done
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
      - name: Install existing pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/descent-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/descent-browser-tools/node_modules/.bin/playwright" install-deps chromium
          google-chrome --version
      - name: Measure cold and warm frames with collection only after timing
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/descent-browser-tools/node_modules/playwright
        run: |
          xvfb-run -a node qa/startup_descent/run_browser.js \
            --baseline-root "$PWD/baseline" --candidate-root "$PWD/candidate" --qa-tools "$PWD" \
            --baseline-pair "$RUNNER_TEMP/descent-baseline" \
            --candidate-pair "$RUNNER_TEMP/descent-candidate" \
            --output "$RUNNER_TEMP/descent-browser"
      - name: Retain source-bound diagnostics only, never profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-descent-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/descent-baseline/pair.json
            ${{ runner.temp }}/descent-baseline/overlay-source/
            ${{ runner.temp }}/descent-baseline/*/diagnostic-manifest.json
            ${{ runner.temp }}/descent-baseline/*/evidence/
            ${{ runner.temp }}/descent-candidate/pair.json
            ${{ runner.temp }}/descent-candidate/overlay-source/
            ${{ runner.temp }}/descent-candidate/*/diagnostic-manifest.json
            ${{ runner.temp }}/descent-candidate/*/evidence/
            ${{ runner.temp }}/descent-browser/
          if-no-files-found: error
          retention-days: 7
