name: Diagnose session request-renew race (synthetic only)
on:
  pull_request:
    paths:
      - '.github/workflows/request-renew-diagnostic.yml'
      - 'ci/*request_race_diagnostic.py'
      - 'firebase/fullflow.test.mjs'
      - 'firebase/transaction_observer*'
      - 'firebase/request_renew_race.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: request-renew-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  race:
    if: github.head_ref == 'qa/cloud-session-race-010a' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify QA-only source and observer negative controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 8d63f936245602628386026732a6dd030dce0fc9^{tree})" = 08bd2d87c4969dce910c7907682f4653b0110b65
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/request-renew-diagnostic.yml','ci/prepare_request_race_diagnostic.py','ci/test_prepare_request_race_diagnostic.py','firebase/fullflow.test.mjs','firebase/transaction_observer.mjs','firebase/transaction_observer.test.mjs','firebase/request_renew_race.test.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only','8d63f936245602628386026732a6dd030dce0fc9','HEAD'],text=True).splitlines())
          assert changed<=allowed,'Non-QA changes detected'
          PY
          python3 -m unittest discover -s ci -p test_prepare_request_race_diagnostic.py -v
          node firebase/transaction_observer.test.mjs
          node --check firebase/fullflow.test.mjs
          node --check firebase/request_renew_race.test.mjs
      - name: Verify exact final compiled export and matching native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/race-retained"
          gh api repos/yiyousiow000814/little-leaf/actions/artifacts/11618320268/zip > "$RUNNER_TEMP/race-retained/web.zip"
          gh api repos/yiyousiow000814/little-leaf/actions/artifacts/11617553429/zip > "$RUNNER_TEMP/race-retained/evidence.zip"
          python3 ci/prepare_request_race_diagnostic.py --artifacts "$RUNNER_TEMP/race-retained"
      - name: Prepare pinned emulator browser and geometry tools
        run: |
          set -euo pipefail
          python3 ci/install_tools.py godot --output "$RUNNER_TEMP/race-godot"
          GODOT_BIN="$RUNNER_TEMP/race-godot/godot" python3 ci/prepare_cloud_geometry.py --output "$RUNNER_TEMP/race-geometry"
          npm --prefix firebase ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/race-browser" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/race-browser/node_modules/.bin/playwright" install-deps chromium
      - name: Observe deterministic race and returning offline device with real rules
        timeout-minutes: 12
        env:
          GODOT_BIN: ${{ runner.temp }}/race-godot/godot
          CLOUD_GEOMETRY_PROJECT: ${{ runner.temp }}/race-geometry/project
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/race-browser/node_modules/playwright
          REQUEST_RENEW_REPORT: ${{ runner.temp }}/race-output/request-renew.json
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/race-output"
          cd firebase
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-little-leaf "node request_renew_race.test.mjs && xvfb-run -a node fullflow.test.mjs --diagnostic-only --web-build '$RUNNER_TEMP/race-retained/web' --engine-report '$RUNNER_TEMP/race-retained/evidence/engine-evidence/summary.json' --output '$RUNNER_TEMP/race-output'"
      - name: Retain bounded diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: request-renew-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/race-retained/race-binding.json
            ${{ runner.temp }}/race-output/request-renew.json
            ${{ runner.temp }}/race-output/firebase-fullflow.json
            ${{ runner.temp }}/race-output/*.png
          if-no-files-found: warn
          retention-days: 7
