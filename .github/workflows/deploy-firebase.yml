name: Deploy reviewed Firebase test build
on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Existing live deployment or approved one-day itch preview; preview never updates Auth domains
        required: true
        default: live
        type: choice
        options: [live, itch-preview, auth-pause-update, auth-pause-rollback]
      source_sha:
        description: Exact reviewed Firebase candidate commit; may be an approved unmerged preview
        required: true
        type: string
      variant_run_id:
        description: Successful source-staging workflow run containing the selected artifact
        required: true
        type: string
      variant_artifact_id:
        description: Exact immutable Firebase variant artifact ID from that run
        required: true
        type: string
      variant_manifest_sha256:
        description: Reviewed SHA-256 of firebase-variant-manifest.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: firebase-static-little-leaf-41e5d
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.deployment_mode == 'live' || inputs.deployment_mode == 'itch-preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VARIANT_RUN_ID: ${{ inputs.variant_run_id }}
      VARIANT_ARTIFACT_ID: ${{ inputs.variant_artifact_id }}
      VARIANT_MANIFEST_SHA256: ${{ inputs.variant_manifest_sha256 }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'live' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate explicit selection and successful same-repository artifact origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VARIANT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VARIANT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VARIANT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VARIANT_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$VARIANT_ARTIFACT_ID" > "$RUNNER_TEMP/staging-artifact.json"
          python3 - <<'PY'
          import json, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((folder / 'staging-run.json').read_text())
          artifact = json.loads((folder / 'staging-artifact.json').read_text())
          repository = 'yiyousiow000814/little-leaf'
          assert run['id'] == int(os.environ['VARIANT_RUN_ID'])
          assert run['repository']['full_name'] == repository
          assert run['head_repository']['full_name'] == repository
          assert run['path'] == '.github/workflows/stage-firebase.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['VARIANT_ARTIFACT_ID'])
          assert artifact['workflow_run']['id'] == run['id'] and not artifact['expired']
          assert artifact['name'] == 'little-leaf-firebase-' + os.environ['SOURCE_SHA'] + '-' + str(run['run_attempt'])
          if os.environ['DEPLOYMENT_MODE'] == 'itch-preview':
              assert run['head_sha'] == os.environ['SOURCE_SHA']
          elif os.environ['DEPLOYMENT_MODE'] != 'live':
              raise ValueError('Unknown deployment mode')
          PY
      - name: Download only the exact selected Firebase variant
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.variant_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.variant_run_id }}
          path: ${{ runner.temp }}/firebase-variant
          merge-multiple: true
          digest-mismatch: error
      - name: Verify the exact reviewed package before requesting any Google token
        run: |
          python3 -m unittest discover -s tests/tooling -t . -p 'test_firebase_hosting_deploy.py' -v
          preview_args=()
          if [[ "$DEPLOYMENT_MODE" == 'itch-preview' ]]; then
            python3 -m unittest discover -s tests/tooling -t . -p 'test_firebase_hosting_preview.py' -v
            preview_args=(--itch-preview)
          fi
          python3 ci/deploy_firebase_hosting.py --variant "$RUNNER_TEMP/firebase-variant" --sha "$SOURCE_SHA" --manifest-sha256 "$VARIANT_MANIFEST_SHA256" --output "$RUNNER_TEMP/firebase-receipt/deployment.json" --verify-only "${preview_args[@]}"
      - name: Obtain a short-lived Hosting-only token after all package checks
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: little-leaf-41e5d
          workload_identity_provider: projects/865267465971/locations/global/workloadIdentityPools/github-little-leaf/providers/github
          service_account: little-leaf-hosting-deployer@little-leaf-41e5d.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish selected static test build and check its live marker
        if: env.DEPLOYMENT_MODE == 'live'
        env:
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 ci/deploy_firebase_hosting.py --variant "$RUNNER_TEMP/firebase-variant" --sha "$SOURCE_SHA" --manifest-sha256 "$VARIANT_MANIFEST_SHA256" --output "$RUNNER_TEMP/firebase-receipt/deployment.json"
      - name: Publish only the approved one-day itch preview without Auth synchronization
        if: env.DEPLOYMENT_MODE == 'itch-preview'
        env:
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 ci/deploy_firebase_hosting.py --variant "$RUNNER_TEMP/firebase-variant" --sha "$SOURCE_SHA" --manifest-sha256 "$VARIANT_MANIFEST_SHA256" --output "$RUNNER_TEMP/firebase-receipt/deployment.json" --itch-preview
      - name: Retain deployment and rollback receipt without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-firebase-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-receipt/deployment.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain the exact bound itch test wrapper and source inventory
        if: always() && env.DEPLOYMENT_MODE == 'itch-preview'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-itch-preview-wrapper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/firebase-receipt/itch-wrapper.zip
            ${{ runner.temp }}/firebase-receipt/preview-bound-manifest.json
          if-no-files-found: warn
          retention-days: 1
  auth-pause:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.deployment_mode == 'auth-pause-update' || inputs.deployment_mode == 'auth-pause-rollback')
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.2'
          architecture: x64
      - name: Verify the fixed qualified artifact origin without a Google token
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VARIANT_RUN_ID: ${{ inputs.variant_run_id }}
          VARIANT_ARTIFACT_ID: ${{ inputs.variant_artifact_id }}
          VARIANT_MANIFEST_SHA256: ${{ inputs.variant_manifest_sha256 }}
        run: |
          gh api repos/yiyousiow000814/little-leaf/actions/runs/38029738586 > "$RUNNER_TEMP/base-run.json"
          gh api repos/yiyousiow000814/little-leaf/actions/artifacts/11662670060 > "$RUNNER_TEMP/base-artifact.json"
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'ci')
          from update_auth_preview import recipe
          p = recipe(); folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((folder/'base-run.json').read_text()); artifact = json.loads((folder/'base-artifact.json').read_text())
          assert os.environ['SOURCE_SHA'] == p['source_commit']
          assert os.environ['VARIANT_RUN_ID'] == str(p['base_run_id'])
          assert os.environ['VARIANT_ARTIFACT_ID'] == str(p['base_artifact_id'])
          assert os.environ['VARIANT_MANIFEST_SHA256'] == p['base_manifest_sha256']
          assert run['id'] == p['base_run_id'] and run['head_sha'] == p['source_commit']
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == 'yiyousiow000814/little-leaf'
          assert run['path'] == '.github/workflows/stage-firebase.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert artifact['id'] == p['base_artifact_id'] and artifact['workflow_run']['id'] == run['id']
          assert artifact['name'] == p['base_artifact_name'] and artifact['expired'] is False
          assert artifact['digest'] == 'sha256:eb7bc08d43995647bfc2bf9aca6d82a85598a0af46718f439969f61659b59a31'
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 11662670060
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38029738586
          path: ${{ runner.temp }}/qualified-base
          merge-multiple: true
          digest-mismatch: error
      - name: Verify qualified base and reconstruct only the exact reviewed ZIPs
        run: |
          python ci/deploy_firebase_hosting.py --variant "$RUNNER_TEMP/qualified-base" --sha 1d7b7b5f12cced3d682cb37ecd0957e2585f19d0 --manifest-sha256 79ec16fe11ff9ccee09902194b00be135fce51ab651a9caa6d7767d41a19daa9 --output "$RUNNER_TEMP/unused.json" --verify-only --itch-preview
          python ci/update_auth_preview.py --stage "$RUNNER_TEMP/qualified-base" --output "$RUNNER_TEMP/auth-pause-packets"
          python -m unittest tests.tooling.test_auth_preview_update -v
          node tests/fixtures/auth_preview_pause.js "$RUNNER_TEMP/auth-pause-packets/update/public/index.html" ci/auth_preview_pause/update/diagnostic-manifest.json "$RUNNER_TEMP/auth-pause-packets/update/public/little_leaf_firebase_boot.mjs"
      - name: Obtain the existing short-lived Hosting-only token after all checks
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: little-leaf-41e5d
          workload_identity_provider: projects/865267465971/locations/global/workloadIdentityPools/github-little-leaf/providers/github
          service_account: little-leaf-hosting-deployer@little-leaf-41e5d.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting
          create_credentials_file: false
          export_environment_variables: false
      - name: Update or restore only the existing exact preview without changing its expiry
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          FIREBASE_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          mode=update
          if [[ "$DEPLOYMENT_MODE" == auth-pause-rollback ]]; then mode=rollback; fi
          python ci/update_auth_preview.py --archive "$RUNNER_TEMP/auth-pause-packets/$mode.zip" --mode "$mode" --output "$RUNNER_TEMP/auth-pause-receipt/deployment.json"
      - name: Retain the bounded receipt without credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-auth-pause-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth-pause-receipt/deployment.json
          if-no-files-found: warn
          retention-days: 30
