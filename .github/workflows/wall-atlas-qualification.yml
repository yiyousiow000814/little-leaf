name: Wall original-three atlas qualification
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tools/diagnostics/wall_atlas_qualification.py'
      - '.github/workflows/wall-atlas-qualification.yml'
permissions:
  contents: read
concurrency:
  group: wall-atlas-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  original-three:
    # Only the qualification diagnostic-path update runs this original-three job.
    if: github.event.before == '023ea0a89dc71d65087a6ae6cb610abeb5ba0d98' && github.head_ref == 'perf/retain-wall-slice-draws' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed renderer and unchanged atlas artifacts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: /usr/bin/python3 tools/diagnostics/wall_atlas_qualification.py --expected-head "$EXPECTED_HEAD" --verify-only
      - name: Install existing checksum-pinned official engine
        run: /usr/bin/python3 tools/ci/install_tools.py godot --native-only --output "$RUNNER_TEMP/wall-tools"
      - name: Prepare the existing native software-rendering route
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 python3-pil
          dpkg-query -W xvfb libgl1-mesa-dri libglx-mesa0 python3-pil > "$RUNNER_TEMP/wall-tools/renderer-packages.txt"
      - name: Regenerate original three and independently decode nine PNGs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 tools/diagnostics/wall_atlas_qualification.py \
            --expected-head "$EXPECTED_HEAD" --godot "$RUNNER_TEMP/wall-tools/godot" --output "$RUNNER_TEMP/wall-atlas"
      - name: Preserve PNGs, source bindings and failures without generated profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wall-atlas-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wall-atlas/
            ${{ runner.temp }}/wall-tools/godot-toolchain-receipt.json
            ${{ runner.temp }}/wall-tools/renderer-packages.txt
          if-no-files-found: error
          retention-days: 7
