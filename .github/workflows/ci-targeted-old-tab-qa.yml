name: QA only - Existing open old tab replay
on:
  push:
    branches: [qa/397-browser-clock-caseb-replay]
permissions:
  contents: read
  actions: read
jobs:
  isolated-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact sources used by both downloaded exports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e3cb10cdae7300c76d596295d0860a8015087908
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the diagnostic test edits separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .caseb-test-overlay
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14760101249,14759672678'
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
          run-id: '45035606300'
          github-token: ${{ github.token }}
      - name: Install shared pinned browser tools
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/inbox-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/inbox-browser-tools/node_modules/.bin/playwright" install-deps chromium
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          google-chrome --version
      - name: Install the exact checksum-pinned Chrome
        run: python3 tools/ci/install_tools.py chrome --output "$RUNNER_TEMP/chrome-tools"
      - name: Activate and verify the pinned Chrome channel
        run: |
          sudo dpkg -i "$CHROME_DEB"
          python3 -c 'from tools.ci.install_tools import verify_chrome_version; verify_chrome_version()'
      - name: Check out the exact historical wall-format-1 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9110ebd9a2d6cbf4d2af303be0e244e660c0f7fc
          path: .compatibility-old
          persist-credentials: false
      - name: Bind identical producer layouts without native work
        run: python3 tools/qualification/prepare_browser_qa.py wall --merge-only --old-source .compatibility-old --old-build "$RUNNER_TEMP/old-web-build" --new-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/web-build/evidence/wall-preflight"
      - name: Overlay only the two browser test drivers onto the exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e3cb10cdae7300c76d596295d0860a8015087908
          for file in tests/rendering/wall_compatibility_browser.js tests/rendering/wall_compatibility_ocr_test.js; do
            cp ".caseb-test-overlay/$file" "$file"
            sha256sum "$file"
          done
      - name: Verify actual old and new Web save compatibility
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          node tests/rendering/wall_compatibility_ocr_test.js --ocr-fixtures > "$RUNNER_TEMP/web-build/evidence/wall-ocr-fixtures.log"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/rendering/wall_compatibility_browser.js --case already_open_old --old-source .compatibility-old --old-web "$RUNNER_TEMP/old-web-build/web" --new-web "$RUNNER_TEMP/web-build/web" --layout-dir "$RUNNER_TEMP/web-build/evidence/wall-preflight" --output "$RUNNER_TEMP/web-build/evidence/wall-browser/already_open_old"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wall-caseb-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/web-build/evidence/wall-browser/already_open_old/
          if-no-files-found: warn
          retention-days: 7
