name: Reusable Web build
on:
  workflow_call:
    inputs:
      release_tag:
        description: Empty for CI; exact version tag for release verification
        type: string
        default: ''
      firebase_preview:
        description: Stage Firebase from this complete fresh run; never deploy
        type: boolean
        default: false
    outputs:
      artifact_id:
        description: Exact artifact from this tested source
        value: ${{ jobs.build.outputs.artifact_id }}
      firebase_artifact_id:
        description: Same-run Firebase preview after all gates passed
        value: ${{ jobs.build.outputs.firebase_artifact_id }}
      firebase_manifest_sha256:
        description: Exact newly generated Firebase manifest hash
        value: ${{ jobs.build.outputs.firebase_manifest_sha256 }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    # Existing two-engine/compatibility budget plus Log (5m), recovery (9m),
    # fresh tutorial (6m), and WebKit provisioning headroom. All gates remain mandatory.
    timeout-minutes: 55
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      firebase_artifact_id: ${{ steps.firebase_upload.outputs.artifact-id }}
      firebase_manifest_sha256: ${{ steps.firebase_prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify metadata and CI guard tests
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 ci/release_metadata.py --tag "$RELEASE_TAG"
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          node tests/crazygames_storage.js
          node tests/legacy_byte_storage.js
          node tests/boot_presentation.js
          node tests/fresh_tutorial_browser_test.js
          node --check tests/fresh_tutorial_browser.js
          node tests/save_log_observers.js
          node tests/save_log_privacy.js
          node tests/web_performance_lifecycle.js
          node tests/connection_recovery.js
          node tests/compensation_inbox_storage.js
          node tests/wall_compatibility_helpers_test.js
          node tests/wall_compatibility_ocr_test.js
          node --check tests/wall_compatibility_browser.js
          node --check tests/save_log_browser.js
          node --check tests/connection_recovery_browser.js
      - name: Install checksum-pinned Godot and official Web template
        run: python3 ci/install_tools.py godot --output "$RUNNER_TEMP/godot-tools"
      - name: Run all engine regression suites in disposable profiles
        run: python3 tests/run_integration_candidate.py --output "$RUNNER_TEMP/engine-evidence"
      - name: Export exact source and verify packed resources
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 ci/build_web.py --output "$RUNNER_TEMP/web-build" --test-report "$RUNNER_TEMP/engine-evidence/summary.json" --tag "$RELEASE_TAG"
      - name: Export separate CrazyGames variant after the unchanged complete Web gate
        run: python3 ci/build_crazygames.py --validated-web-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/crazygames-build"
      - name: Retain separate CrazyGames export for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-crazygames-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crazygames-build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Retain engine-tested Web export before browser validation
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-web-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Install shared pinned browser tools
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/inbox-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/inbox-browser-tools/node_modules/.bin/playwright" install-deps chromium
          "$RUNNER_TEMP/inbox-browser-tools/node_modules/.bin/playwright" install --with-deps webkit
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          google-chrome --version
      - name: Verify cloud recovery in real IndexedDB before merge
        timeout-minutes: 4
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate adapter.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate delayed-network.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate recovery.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate choice.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate session.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate update-notice.log --output "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate recovery-presentation.log --output "$RUNNER_TEMP/firebase-focused"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" python3 ci/run_firebase_focused.py --gate recovery-browser.log --output "$RUNNER_TEMP/firebase-focused"
      - name: Verify compensation history in sandboxed Chromium
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          node tests/engine_launch_hook_test.js "$RUNNER_TEMP/web-build/web/index.js" > "$RUNNER_TEMP/web-build/evidence/engine-launch-hook.json"
          mkdir -p "$RUNNER_TEMP/web-build/evidence/inbox-browser"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/compensation_inbox_browser.js --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/inbox-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_compensation_inbox-result.json"
      - name: Verify fresh tutorial and natural first payment in ordinary Web
        timeout-minutes: 6
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          node tests/fresh_tutorial_browser_test.js --ocr-fixtures > "$RUNNER_TEMP/web-build/evidence/fresh-tutorial-ocr-fixtures.log"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/fresh_tutorial_browser.js --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/fresh-tutorial-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_interactive_tutorial-result.json" --engine-report "$RUNNER_TEMP/engine-evidence/summary.json"
      - name: Check out the exact historical wall-format-1 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9110ebd9a2d6cbf4d2af303be0e244e660c0f7fc
          path: .compatibility-old
          persist-credentials: false
      - name: Test and export the unchanged historical client once
        run: |
          test "$(git -C .compatibility-old rev-parse HEAD)" = 9110ebd9a2d6cbf4d2af303be0e244e660c0f7fc
          cmp ci/toolchain.json .compatibility-old/ci/toolchain.json
          python3 .compatibility-old/tests/run_integration_candidate.py --output "$RUNNER_TEMP/old-engine-evidence" --lock "$RUNNER_TEMP/old-engine.lock"
          python3 .compatibility-old/ci/build_web.py --output "$RUNNER_TEMP/old-web-build" --test-report "$RUNNER_TEMP/old-engine-evidence/summary.json"
      - name: Bind compatibility inputs and derive UI coordinates
        run: python3 ci/prepare_wall_compatibility.py --old-source .compatibility-old --old-build "$RUNNER_TEMP/old-web-build" --new-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/web-build/evidence/wall-preflight"
      - name: Verify actual old and new Web save compatibility
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          node tests/wall_compatibility_ocr_test.js --ocr-fixtures > "$RUNNER_TEMP/web-build/evidence/wall-ocr-fixtures.log"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/wall_compatibility_browser.js --old-source .compatibility-old --old-web "$RUNNER_TEMP/old-web-build/web" --new-web "$RUNNER_TEMP/web-build/web" --layout-dir "$RUNNER_TEMP/web-build/evidence/wall-preflight" --output "$RUNNER_TEMP/web-build/evidence/wall-browser"
      - name: Verify exported save diagnostic in sandboxed Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/save_log_browser.js --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/save-log-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_save_log-result.json"
      - name: Verify closed-connection recovery in actual exported WebKit game
        timeout-minutes: 9
        env:
          RUNTIME_BROWSER: webkit
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/connection_recovery_browser.js --run-hosted --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/connection-recovery-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_save_log-result.json" --engine-report "$RUNNER_TEMP/engine-evidence/summary.json"
      - name: Check Firebase adapter and fresh staging contracts
        if: inputs.firebase_preview
        timeout-minutes: 4
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-focused"
          python3 ci/run_firebase_focused.py --gate staging-tests.log --output "$RUNNER_TEMP/firebase-focused"
          node --check web/little_leaf_firebase_boot.mjs
      - name: Verify Firebase rules and SDK CAS in a disposable local emulator
        if: inputs.firebase_preview
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm --prefix firebase ci --ignore-scripts --no-audit --no-fund
          python3 ci/run_firebase_focused.py --gate rules.log --output "$RUNNER_TEMP/firebase-focused"
      - name: Stage Firebase only from this exact fresh all-gates build
        if: inputs.firebase_preview
        id: firebase_prepare
        run: |
          python3 ci/build_firebase.py --validated-web-build "$RUNNER_TEMP/web-build" --output "$RUNNER_TEMP/firebase-variant" --public-config firebase/public-config.json --require-fresh-ci --engine-report "$RUNNER_TEMP/engine-evidence/summary.json" --focused-logs "$RUNNER_TEMP/firebase-focused"
      - name: Retain the fresh tested Firebase preview without publication
        if: inputs.firebase_preview
        id: firebase_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.firebase_prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/firebase-variant/
          if-no-files-found: error
          retention-days: 7
      - name: Record fresh preview handoff
        if: inputs.firebase_preview
        env:
          ARTIFACT_ID: ${{ steps.firebase_upload.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ steps.firebase_prepare.outputs.manifest_sha256 }}
        run: |
          printf 'Fresh source: %s\nRun: %s\nArtifact ID: %s\nManifest SHA256: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
          printf 'All existing native/export/browser gates and focused Firebase/emulator checks passed in this run. No historical CI artifact reuse, deployment, or hosted/device acceptance is claimed.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test and export evidence (never profiles or credentials)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/engine-evidence/*.json
            ${{ runner.temp }}/engine-evidence/*.log
            ${{ runner.temp }}/web-build/evidence/
            ${{ runner.temp }}/crazygames-build/evidence/
            ${{ runner.temp }}/old-engine-evidence/*.json
            ${{ runner.temp }}/old-engine-evidence/*.log
            ${{ runner.temp }}/old-web-build/evidence/
            ${{ runner.temp }}/firebase-focused/
          if-no-files-found: warn
          retention-days: 7
