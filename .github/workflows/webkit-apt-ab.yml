name: Isolated recovery WebKit provisioning A/B
on:
  push:
    branches: [bench/webkit-provision-v1]
    paths: ['.github/workflows/webkit-apt-ab.yml', 'bench/webkit-provision-v1/**']
permissions: {}
jobs:
  recovery-ab:
    if: github.repository == 'yiyousiow000814/little-leaf'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, candidate]
    env:
      ARM: ${{ matrix.arm }}
      SOURCE_SHA: e4f1899cfa4df589a91cd018dfb8faa817f09cfc
      PR_HEAD_SHA: 31c765d02bb591442c0480f01c2f3df4bfee40ba
      ORIGIN_RUN: '44253161109'
      ORIGIN_ARTIFACT: '14404693832'
      ORIGIN_DIGEST: sha256:14bd1d23247ab67045d8f51edd0191bd27339922a3c21f849563a2c925e7ac68
      ORIGIN_NAME: little-leaf-ci-inputs-e4f1899cfa4df589a91cd018dfb8faa817f09cfc-1
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: benchmark
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          path: source
      - name: Bind exact successful run and artifact
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ab-receipts"
          mkdir -p "$d" "$RUNNER_TEMP/firebase-focused"
          export GH_REPO=yiyousiow000814/little-leaf
          gh api "repos/$GH_REPO/actions/runs/$ORIGIN_RUN" | jq -e --arg head "$PR_HEAD_SHA" --arg rid "$ORIGIN_RUN" --arg repo "$GH_REPO" '
            select((.id|tostring)==$rid and .head_sha==$head and .event=="pull_request" and .name=="Check and build Web" and
            .conclusion=="success" and .run_attempt==1 and .repository.full_name==$repo and .head_repository.full_name==$repo) |
            {id,run_attempt,name,head_sha,event,conclusion,repository:.repository.full_name}' > "$d/origin-run.json"
          gh api "repos/$GH_REPO/actions/artifacts/$ORIGIN_ARTIFACT" | jq -e --arg head "$PR_HEAD_SHA" --arg rid "$ORIGIN_RUN" --arg aid "$ORIGIN_ARTIFACT" --arg name "$ORIGIN_NAME" --arg digest "$ORIGIN_DIGEST" '
            select((.id|tostring)==$aid and .name==$name and .expired==false and .size_in_bytes>0 and
            (.workflow_run.id|tostring)==$rid and .workflow_run.head_sha==$head and .workflow_run.repository_id==1403804463 and
            .workflow_run.head_repository_id==1403804463 and .digest==$digest) |
            {id,name,size_in_bytes,digest,workflow_run:{id:.workflow_run.id,head_sha:.workflow_run.head_sha}}' > "$d/origin-artifact.json"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'PLAYWRIGHT_MODULE=%s/inbox-browser-tools/node_modules/playwright\nPLAYWRIGHT_BROWSERS_PATH=%s/recovery-browsers\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$ImageOS $ImageVersion" > "$d/runner-image.txt"
          dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' | LC_ALL=C sort > "$d/dpkg-before-all.txt"
      - name: Download only exact origin artifact with digest enforcement
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: yiyousiow000814/little-leaf
          run-id: ${{ env.ORIGIN_RUN }}
          artifact-ids: ${{ env.ORIGIN_ARTIFACT }}
          path: ${{ runner.temp }}
          digest-mismatch: error
      - name: Verify clean native engine, export and exact save-layout binding
        working-directory: source
        timeout-minutes: 1
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP" "$SOURCE_SHA" "$ORIGIN_RUN" > "$RUNNER_TEMP/ab-receipts/input-binding.json" <<'JS'
          const {readFileSync}=require('node:fs'), assert=require('node:assert/strict'), crypto=require('node:crypto');
          const [root,source,run]=process.argv.slice(2);
          const engine=root+'/engine-evidence/summary.json';
          const {validateBinding}=require('./tests/presentation/fresh_tutorial_browser');
          const {layout,...receipt}=validateBinding(root+'/web-build/web',root+'/engine-evidence/test_interactive_tutorial-result.json',engine);
          const manifest=JSON.parse(readFileSync(root+'/web-build/web/release-manifest.json'));
          assert.equal(manifest.source_commit,source); assert.equal(String(manifest.workflow_run),run); assert.equal(String(manifest.workflow_attempt),'1');
          const e=JSON.parse(readFileSync(engine));
          assert.equal(e.source_commit,source); assert.equal(String(e.workflow_run),run); assert.equal(String(e.workflow_attempt),'1');
          const [row,...extra]=e.records.filter(row=>row.test==='test_save_log');
          assert(row&&extra.length===0);assert.equal(row.exit_code,0);assert.deepEqual(row.failures,[]);
          const saveLayout=crypto.createHash('sha256').update(readFileSync(root+'/engine-evidence/test_save_log-result.json')).digest('hex');
          assert.equal(row.result_sha256,saveLayout);
          console.log(JSON.stringify({...receipt,saveLayout}));
          JS
      - name: Same approved Chromium setup in both arms
        timeout-minutes: 4
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ab-receipts"
          /usr/bin/time -o "$d/driver.seconds" -f %e npm install --prefix "$RUNNER_TEMP/inbox-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          /usr/bin/time -o "$d/shared-chromium.seconds" -f %e python3 benchmark/bench/webkit-provision-v1/play_provision.py candidate "$d/chromium-transaction.json"
      - name: Install and verify exact Chrome in both arms
        working-directory: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          /usr/bin/time -o "$RUNNER_TEMP/ab-receipts/chrome-download.seconds" -f %e python3 tools/ci/install_tools.py chrome --output "$RUNNER_TEMP/chrome-tools"
          sudo dpkg -i "$RUNNER_TEMP/chrome-tools/google-chrome-stable.deb"
          python3 -c 'from tools.ci.install_tools import verify_chrome_version; verify_chrome_version()'
          sha256sum "$RUNNER_TEMP/chrome-tools/google-chrome-stable.deb" > "$RUNNER_TEMP/ab-receipts/chrome-sha256.txt"
          dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' | LC_ALL=C sort > "$RUNNER_TEMP/ab-receipts/dpkg-before-webkit.txt"
      - name: A B only WebKit system provisioning
        timeout-minutes: 14
        run: python3 benchmark/bench/webkit-provision-v1/ubuntu_webkit.py "$ARM" "$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright-core" "$RUNNER_TEMP/ab-receipts"
      - name: Download the existing WebKit 26.6 and FFmpeg revisions on a cold browser path
        timeout-minutes: 3
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ab-receipts"
          /usr/bin/time -o "$d/webkit-binary.seconds" -f %e "$RUNNER_TEMP/inbox-browser-tools/node_modules/.bin/playwright" install webkit
          test -d "$PLAYWRIGHT_BROWSERS_PATH/webkit-2359"
          test -d "$PLAYWRIGHT_BROWSERS_PATH/ffmpeg-1011"
          node -e 'const assert=require("node:assert/strict"),p=require(process.env.PLAYWRIGHT_MODULE+"/../playwright-core/browsers.json").browsers;for(const [n,r] of [["webkit","2359"],["ffmpeg","1011"]])assert.equal(p.find(x=>x.name===n).revision,r); console.log(JSON.stringify(p.filter(x=>["webkit","ffmpeg"].includes(x.name))))' > "$d/browser-revisions.json"
          dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' | LC_ALL=C sort > "$d/dpkg-after-webkit.txt"
          fc-list | LC_ALL=C sort > "$d/fonts.txt"
          for f in libgstlibav.so libgstplayback.so libgstsoup.so; do
            p="/usr/lib/x86_64-linux-gnu/gstreamer-1.0/$f"
            test -f "$p"
            ldd "$p" >> "$d/gstreamer-ldd.txt"
          done
          if grep -F 'not found' "$d/gstreamer-ldd.txt"; then exit 1; fi
      - name: Verify cloud recovery in real IndexedDB before merge
        working-directory: source
        timeout-minutes: 4
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate adapter.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate delayed-network.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate recovery.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate choice.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate session.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate update-notice.log --output "$RUNNER_TEMP/firebase-focused"
          python3 tools/qualification/run_firebase_focused.py --gate recovery-presentation.log --output "$RUNNER_TEMP/firebase-focused"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" python3 tools/qualification/run_firebase_focused.py --gate recovery-browser.log --output "$RUNNER_TEMP/firebase-focused"
      - name: Verify grid upgrade archive transaction and reopen
        working-directory: source
        timeout-minutes: 3
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/inbox-browser-tools/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-focused"
          node tests/persistence/pre_grid_archive_browser.js > "$RUNNER_TEMP/firebase-focused/pre-grid-archive-browser.json"
      - name: Verify exported save diagnostic in sandboxed Chromium
        working-directory: source
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/persistence/save_log_browser.js --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/save-log-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_save_log-result.json"
      - name: Verify closed-connection recovery in actual exported WebKit game
        working-directory: source
        timeout-minutes: 9
        env:
          RUNTIME_BROWSER: webkit
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-browser-tools/node_modules/playwright" xvfb-run -a node tests/persistence/connection_recovery_browser.js --run-hosted --web-build "$RUNNER_TEMP/web-build/web" --output "$RUNNER_TEMP/web-build/evidence/connection-recovery-browser" --layout-report "$RUNNER_TEMP/engine-evidence/test_save_log-result.json" --engine-report "$RUNNER_TEMP/engine-evidence/summary.json"
      - name: Retain bounded diagnostic evidence only, no profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webkit-provision-ab-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ab-receipts/*.json
            ${{ runner.temp }}/ab-receipts/*.txt
            ${{ runner.temp }}/ab-receipts/*.seconds
            ${{ runner.temp }}/ab-receipts/*.log
            ${{ runner.temp }}/firebase-focused/*.log
            ${{ runner.temp }}/firebase-focused/*.json
            ${{ runner.temp }}/web-build/evidence/save-log-browser/*browser.json
            ${{ runner.temp }}/web-build/evidence/connection-recovery-browser/*browser.json
          if-no-files-found: warn
          retention-days: 3
