name: Release Web to itch.io
on:
  workflow_run:
    workflows: [Check and build Web]
    types: [completed]
  workflow_dispatch: {}
# Only an authenticated successful original common tag qualification can publish.
permissions:
  contents: read
concurrency:
  group: itch-production-html5
  cancel-in-progress: false
jobs:
  diagnose_status:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the unchanged checksum-pinned Butler
        run: python3 tools/ci/install_tools.py butler --output "$RUNNER_TEMP/butler-tools"
      - name: Check version and status help without credentials
        run: python3 tools/diagnostics/diagnose_itch_status.py --binary "$RUNNER_TEMP/butler-tools/butler" --phase preflight --output "$RUNNER_TEMP/itch-status/preflight.json"
      - name: Query only the existing authorized channel; emit whitelist fields
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python3 tools/diagnostics/diagnose_itch_status.py --binary "$RUNNER_TEMP/butler-tools/butler" --phase status --preflight "$RUNNER_TEMP/itch-status/preflight.json" --output "$RUNNER_TEMP/itch-status/status.json"
      - name: Retain only sanitized diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-itch-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/itch-status/*.json
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: coordinator
      - name: Authenticate the ONE common tag package; no engine or common test rerun
        id: common
        env:
          GH_TOKEN: ${{ github.token }}
          COMMON_RUN: ${{ github.event.workflow_run.id }}
        run: python3 coordinator/tools/release/common_tag.py consume --run "$COMMON_RUN" --folder "$RUNNER_TEMP/common-release"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.common.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Revalidate immutable common bytes against exact tagged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C source fetch --no-tags origin main
          python3 coordinator/tools/release/common_tag.py verify --folder "$RUNNER_TEMP/common-release" --source-root source
      - name: Install unchanged checksum-pinned Butler
        run: python3 coordinator/tools/ci/install_tools.py butler --output "$RUNNER_TEMP/butler-tools"
      - name: Publish only this platform; existing duplicate/older/uncertain safeguards
        working-directory: source
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ steps.common.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.common.outputs.source_sha }}
        run: |
          test -n "$BUTLER_API_KEY" || { echo '::error::Missing BUTLER_API_KEY. The owner must personally verify the existing authorized repository secret.'; exit 1; }
          python3 ../coordinator/tools/release/publish_itch.py --web "$RUNNER_TEMP/common-release/web" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --receipt "$RUNNER_TEMP/itch-publication/receipt.json" --common-receipt "$RUNNER_TEMP/common-release/common.json"
      - name: Preserve confirmed publication; failures never become success receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-itch-publication-${{ steps.common.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/itch-publication/receipt.json
          if-no-files-found: error
          retention-days: 30
