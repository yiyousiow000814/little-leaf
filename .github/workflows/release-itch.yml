name: Release Web to itch.io
on:
  push:
    tags: ['v*']
# No PR, main-push, workflow_run, or manual dispatch can publish.
permissions:
  contents: read
concurrency:
  group: itch-production-html5
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag from reviewed main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)[a-z]?$ ]] || { echo '::error::Expected vX.Y.Z or vX.Y.Z[a-z] release tag.'; exit 1; }
          git fetch --no-tags origin main
      - name: Check version binding
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 tools/release_metadata.py --tag "$RELEASE_TAG" --require-main-ancestor)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    name: Reuse qualified exact-main Web package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check final source, version and qualified atlas
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          python3 tools/release_metadata.py --tag "$RELEASE_TAG" --require-main-ancestor
          python3 tools/verify_prebaked_atlases.py
      - name: Install checksum-pinned official startup verifier
        run: python3 tools/install_tools.py godot --output "$RUNNER_TEMP/godot-tools"
      - name: Wait for exact main CI and verify its immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: python3 tools/reuse_main_ci.py --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/qualified-release"
      - name: Retain verified release package in this release run
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-qualified-release-${{ needs.gate.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-release/web/
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact CI origin and final startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-release-qualification-${{ needs.gate.outputs.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-release/qualification.json
            ${{ runner.temp }}/qualified-release/packed-startup.log
          if-no-files-found: warn
          retention-days: 7
  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Refuse missing credentials before any upload
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          test -n "$BUTLER_API_KEY" || { echo '::error::Missing BUTLER_API_KEY. The owner must personally add the legitimate itch credential in GitHub Actions Secrets; never paste it in chat or commit it.'; exit 1; }
      - name: Download this run's exact tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-web
          merge-multiple: true
          digest-mismatch: error
      - name: Install checksum-pinned official Butler
        run: python3 tools/install_tools.py butler --output "$RUNNER_TEMP/butler-tools"
      - name: Recheck source, refuse duplicate/older releases, publish and await processing
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          python3 tools/release_metadata.py --tag "$RELEASE_TAG" --require-main-ancestor
          python3 tools/publish_itch.py --web "$RUNNER_TEMP/release-web" --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --receipt "$RUNNER_TEMP/itch-publication/receipt.json"
      - name: Retain confirmed itch publication and reused CI provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: little-leaf-itch-publication-${{ needs.gate.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/itch-publication/receipt.json
          if-no-files-found: error
          retention-days: 7
