name: Stage Firebase preview
on:
  workflow_call:
    inputs:
      released_run_id:
        description: Independently validated completed itch release; staging only
        required: true
        type: string
  workflow_dispatch:
    inputs:
      released_live_run_id:
        description: Completed exact-main itch release; reuse ordinary CI and run distinct Firebase gates, never deploy
        type: string
        default: ''
      publication_run_id:
        description: Completed exact-source itch run for live-eligible SHA prerelease chronology (empty for preview)
        type: string
        default: ''
      itch_preview:
        description: Stage a trusted-frame bootstrap packet for the one-day preview route; never deploy
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firebase-stage-${{ inputs.released_run_id || github.ref }}
  cancel-in-progress: false
jobs:
  publication:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_run_id && !inputs.released_live_run_id && !inputs.itch_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      receipt: ${{ steps.select.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.publication_run_id }}
        run: |
          python3 tools/firebase_release_event.py --release-run "$RELEASE_RUN" --output "$RUNNER_TEMP/publication-selection"
          python3 - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'publication-selection/selection.json').read_text())
          if data['source_commit']!=os.environ['GITHUB_SHA']:raise ValueError('Publication must match this exact fresh source')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('receipt='+json.dumps(data['publication'],separators=(',',':'))+'\n')
          PY
  fresh:
    needs: publication
    if: always() && github.repository == 'yiyousiow000814/little-leaf' && !inputs.released_run_id && !inputs.released_live_run_id && (needs.publication.result == 'success' || needs.publication.result == 'skipped') && (!inputs.publication_run_id || needs.publication.result == 'success')
    uses: ./.github/workflows/build-web.yml
    with:
      firebase_preview: true
      itch_preview: ${{ inputs.itch_preview || false }}
      publication_receipt: ${{ needs.publication.outputs.receipt || '' }}
  released:
    if: github.repository == 'yiyousiow000814/little-leaf' && github.ref == 'refs/heads/main' && !inputs.itch_preview && ((inputs.released_run_id && github.workflow == 'Qualify Firebase after completed itch release') || (github.event_name == 'workflow_dispatch' && inputs.released_live_run_id && !inputs.publication_run_id && !inputs.released_run_id))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse rerun of an uncertain staging attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: coordinator
      - name: Revalidate completed itch publication from immutable API receipts
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.released_live_run_id || inputs.released_run_id }}
        run: python3 coordinator/tools/firebase_release_event.py --release-run "$RELEASE_RUN" --output "$RUNNER_TEMP/selection"
      - name: Fence the explicit manual live reuse to this exact main source
        if: inputs.released_live_run_id
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0,'coordinator/tools')
          from released_live_provenance import manual_context
          selection=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'selection/selection.json').read_text())
          manual_context(selection,os.environ,os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.select.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Install the official checksum-pinned toolchain; do not rebuild the game
        working-directory: source
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,sys
          layouts=(pathlib.Path('tools/install_tools.py'),pathlib.Path('tools/ci/install_tools.py'))
          installers=[path for path in layouts if path.is_file()]
          if len(installers)!=1:
              raise ValueError('Released source must contain exactly one supported toolchain installer')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot-tools'
          subprocess.run([sys.executable,str(installers[0]),'godot','--output',str(output)],check=True)
          PY
      - name: Reuse only the exact completed release's qualified ordinary runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coordinator/tools/qualification/reuse_released_web.py --source-root source --selection "$RUNNER_TEMP/selection/selection.json" --output "$RUNNER_TEMP/reuse"
      - name: Bind original complete native and browser evidence to this exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 coordinator/tools/stage_released_firebase.py prepare --source-root source --reuse "$RUNNER_TEMP/reuse" --selection "$RUNNER_TEMP/selection/selection.json" --evidence "$RUNNER_TEMP/ordinary-evidence"
      - name: Install isolated browser and emulator test dependencies
        working-directory: source
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install-deps chromium
          npm --prefix platform/firebase ci --ignore-scripts --no-audit --no-fund
          google-chrome --version
      - name: Run all focused Firebase and local emulator gates on the released source
        working-directory: source
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tools/node_modules/playwright
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          for gate in adapter.log delayed-network.log recovery.log choice.log session.log update-notice.log recovery-presentation.log recovery-browser.log staging-tests.log rules.log; do
            python3 tools/run_firebase_focused.py --gate "$gate" --output "$RUNNER_TEMP/firebase-focused"
          done
          node --check platform/web/little_leaf_firebase_boot.mjs
          python3 tools/prepare_browser_qa.py cloud --output "$RUNNER_TEMP/cloud-geometry"
      - name: Verify compiled cloud flows against exactly the released runtime in a disposable emulator
        working-directory: source/platform/firebase
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tools/node_modules/playwright
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          CLOUD_GEOMETRY_PROJECT: ${{ runner.temp }}/cloud-geometry/project
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-little-leaf "xvfb-run -a node fullflow.test.mjs --web-build '$RUNNER_TEMP/reuse/web' --output '$RUNNER_TEMP/firebase-fullflow' --engine-report '$RUNNER_TEMP/ordinary-evidence/engine-evidence/summary.json'"
      - name: Stage the bound Firebase package without production access
        id: stage
        env:
          MANUAL_LIVE_RUN: ${{ inputs.released_live_run_id || '' }}
        run: |
          mode_args=()
          if [[ -n "$MANUAL_LIVE_RUN" ]]; then mode_args=(--manual-live); fi
          python3 coordinator/tools/stage_released_firebase.py stage --source-root source --reuse "$RUNNER_TEMP/reuse" --selection "$RUNNER_TEMP/selection/selection.json" --evidence "$RUNNER_TEMP/ordinary-evidence" --focused "$RUNNER_TEMP/firebase-focused" --fullflow "$RUNNER_TEMP/firebase-fullflow" --output "$RUNNER_TEMP/firebase-variant" "${mode_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/firebase-variant/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve source-bound evidence and failures without credentials or profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: little-leaf-firebase-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection/
            ${{ runner.temp }}/reuse/qualification.json
            ${{ runner.temp }}/reuse/packed-startup.log
            ${{ runner.temp }}/ordinary-evidence/reuse-inputs.json
            ${{ runner.temp }}/firebase-focused/
            ${{ runner.temp }}/firebase-fullflow/
          if-no-files-found: warn
          retention-days: 30
