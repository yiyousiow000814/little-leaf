name: Stage Firebase preview
on:
  workflow_dispatch:
    inputs:
      itch_preview:
        description: Stage a trusted-frame bootstrap packet for the one-day preview route; never deploy
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firebase-fresh-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh:
    if: github.repository == 'yiyousiow000814/little-leaf'
    uses: ./.github/workflows/build-web.yml
    with:
      firebase_preview: true
      itch_preview: ${{ inputs.itch_preview || false }}
