name: Check and build Web
on:
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!docs/**/*.md'
      # Distribution inputs always build, including current and future notices.
      - 'docs/third-party/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    uses: ./.github/workflows/build-web.yml
