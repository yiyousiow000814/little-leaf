name: Active scene backdrop parity and retained-root redraw, exact #397
on:
  push:
    branches: [qa/active-backdrop-397]
permissions:
  contents: read
concurrency:
  group: active-backdrop-397
  cancel-in-progress: false
jobs:
  only-candidate:
    if: >-
      github.repository == 'yiyousiow000814/little-leaf' && github.actor == 'yiyousiow000814' &&
      github.run_attempt == '1' && github.ref == 'refs/heads/qa/active-backdrop-397' &&
      github.event_name == 'push' && !github.event.created && !github.event.deleted && !github.event.forced &&
      github.event.before == 'ce1435afb2329a6c1d2d77a8a19923dfd96bd205'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KIT: tools/diagnostics/active-backdrop-397
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact diagnostic ref and its single parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: tools/diagnostics/active-backdrop-397
          persist-credentials: false
      - name: Verify scope before setup
        run: |
          set -euo pipefail
          python3 -B "$KIT/guard.py" fail "$RUNNER_TEMP/ll-active397-public/summary.json" source_binding
          python3 -B "$KIT/guard.py" event .
      - name: Read exactly the current game and native installer locks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce1435afb2329a6c1d2d77a8a19923dfd96bd205
          path: product
          fetch-depth: 1
          sparse-checkout: |
            game
            tools/ci
          persist-credentials: false
      - name: Import and run one bounded active-scene backdrop diagnostic
        timeout-minutes: 10
        run: bash "$KIT/run.sh"
      - name: Upload bounded summary or allowed failure stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: active-backdrop-397-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ll-active397-public/summary.json
          if-no-files-found: warn
          retention-days: 14
