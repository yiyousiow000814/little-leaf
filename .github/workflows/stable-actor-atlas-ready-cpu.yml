name: Stable café actor atlas-ready CPU controls
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tests/diagnostics/profile_stable_actor_atlas_ready.gd'
      - 'tests/diagnostics/stable_actor_cpu_probe.gd'
      - 'tools/diagnostics/stable_actor_atlas_ready_cpu.py'
      - '.github/workflows/stable-actor-atlas-ready-cpu.yml'
permissions:
  contents: read
concurrency:
  group: stable-actor-atlas-ready-cpu-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  atlas-ready-cpu:
    # One ABBA diagnostic only from the reviewed metadata head. No dispatch or repeats.
    if: github.event.action == 'synchronize' && github.event.before == '86b225edfab6b290bdfcb958ea4f236ed11e0d07' && github.head_ref == 'perf/retain-cafe-actor-owners' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact diagnostic and qualified runtime source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: /usr/bin/python3 tools/diagnostics/stable_actor_atlas_ready_cpu.py --expected-head "$EXPECTED_HEAD" --verify-only
      - name: Install existing checksum-pinned official engine
        run: /usr/bin/python3 tools/ci/install_tools.py godot --native-only --output "$RUNNER_TEMP/stable-actor-cpu-tools"
      - name: Prepare the existing native software-rendering route
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 python3-pil
          dpkg-query -W xvfb libgl1-mesa-dri libglx-mesa0 python3-pil > "$RUNNER_TEMP/stable-actor-cpu-tools/renderer-packages.txt"
      - name: Run exactly four atlas-ready synthetic CPU controls in ABBA order
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' /usr/bin/python3 tools/diagnostics/stable_actor_atlas_ready_cpu.py \
            --expected-head "$EXPECTED_HEAD" --godot "$RUNNER_TEMP/stable-actor-cpu-tools/godot" --output "$RUNNER_TEMP/stable-actor-cpu-saveguard"
      - name: Preserve CPU receipts, source bindings and failures without generated profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-actor-cpu-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stable-actor-cpu-saveguard/
            ${{ runner.temp }}/stable-actor-cpu-tools/godot-toolchain-receipt.json
            ${{ runner.temp }}/stable-actor-cpu-tools/renderer-packages.txt
          if-no-files-found: error
          retention-days: 7
