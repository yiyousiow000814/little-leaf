name: Check first-gesture welcome audio
# Explicit diagnostic; reuse a successful exact-source Web build without repeating it.
on:
  workflow_dispatch:
    inputs:
      web_run_id:
        description: Successful Check and build Web run for the identical source tree
        required: true
        type: string
      web_artifact_id:
        description: Nonexpired ordinary-Web artifact ID from that run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: welcome-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  welcome-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and offline fail-closed contracts
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 tools/release_metadata.py
          python3 tools/verify_prebaked_atlases.py
          python3 -m unittest tests.tooling.test_welcome_audio_workflow tests.tooling.test_reuse_welcome_web -v
          node tests/welcome_audio_test.js
          node tests/welcome_source_binding_test.js
          node tests/wall_compatibility_helpers_test.js
          node tests/wall_compatibility_ocr_test.js
          node --check tests/welcome_audio_browser.js
          node --check tests/welcome_audio_helpers.js
          node --check tests/welcome_audio_observer.js
      - name: Select successful equivalent-source ordinary-Web artifact
        id: selected_web
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RUN_ID: ${{ inputs.web_run_id }}
          WEB_ARTIFACT_ID: ${{ inputs.web_artifact_id }}
        run: |
          set -euo pipefail
          python3 tools/reuse_welcome_web.py --phase select --repository "$GITHUB_REPOSITORY" --run-id "$WEB_RUN_ID" --artifact-id "$WEB_ARTIFACT_ID" --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/welcome-audio-web"
      - name: Download the validated artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selected_web.outputs.artifact_id }}
          run-id: ${{ steps.selected_web.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/welcome-audio-web/web
          merge-multiple: true
          digest-mismatch: error
      - name: Verify complete downloaded source and export hashes
        env:
          WEB_RUN_ID: ${{ inputs.web_run_id }}
          WEB_ARTIFACT_ID: ${{ inputs.web_artifact_id }}
        run: |
          set -euo pipefail
          python3 tools/reuse_welcome_web.py --phase verify --repository "$GITHUB_REPOSITORY" --run-id "$WEB_RUN_ID" --artifact-id "$WEB_ARTIFACT_ID" --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/welcome-audio-web"
      - name: Install pinned bundled Chromium and screenshot OCR tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/welcome-audio-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/welcome-audio-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb xauth tesseract-ocr tesseract-ocr-eng
      - name: Verify first click, touch and Enter with independent silent controls
        timeout-minutes: 6
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/welcome-audio-browser-tools/node_modules/playwright" xvfb-run -a -s '-screen 0 1600x1000x24' node tests/welcome_audio_browser.js --source-root "$GITHUB_WORKSPACE" --web-build "$RUNNER_TEMP/welcome-audio-web/web" --output "$RUNNER_TEMP/welcome-audio-web/evidence/welcome-audio"
      - name: Retain exact source, raw audio observations and rendered frames on any outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: welcome-audio-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/welcome-audio-web/artifact-selection.json
            ${{ runner.temp }}/welcome-audio-web/artifact-reuse.json
            ${{ runner.temp }}/welcome-audio-web/web/release-manifest.json
            ${{ runner.temp }}/welcome-audio-web/evidence/
          if-no-files-found: error
          retention-days: 7
