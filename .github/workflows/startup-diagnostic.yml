name: Diagnostic-only startup attribution
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: startup-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic-only:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/background-cache-startup-10a'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: df115a085437633e3538ef5462401f57739fc935
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d4b94a2db84c78ace3aa9aa3b02a151d7e3b17d0
          persist-credentials: false
          path: candidate-source
      - name: Verify immutable artifact identity and preserve diagnostic scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/startup-browser-compare"
          gh api repos/yiyousiow000814/little-leaf/actions/artifacts/11607085910 > "$RUNNER_TEMP/startup-browser-compare/candidate-artifact.json"
          gh api repos/yiyousiow000814/little-leaf/actions/artifacts/11606561466 > "$RUNNER_TEMP/startup-browser-compare/baseline-artifact.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'startup-browser-compare'
          for label, ident, digest in [('candidate', 11607085910, '2ef61b9053c13ed60fb24e3a399513901cba350c6d5d37f8cfe9b27da2f6c839'), ('baseline', 11606561466, 'fd37649bf6df5106475faee09aa3a9631c82ec9d7e3b7591f13c2a598c44a47c')]:
              record = json.loads((out / (label + '-artifact.json')).read_text())
              assert record['id'] == ident and record['digest'] == 'sha256:' + digest
              assert record['workflow_run']['id'] == 37909699970 and not record['expired']
          (out / 'DIAGNOSTIC_ONLY.txt').write_text('Historical same-run engine-tested exports. Browser qualification failed before trials on a QA-only CDP call. These diagnostic results cannot qualify a release or replace current full CI. Both exact exported production hash maps must match their pinned source checkouts.\n')
          PYCODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 11607085910
          path: ${{ runner.temp }}/candidate-web
          run-id: 37909699970
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 11606561466
          path: ${{ runner.temp }}/baseline-web
          run-id: 37909699970
          github-token: ${{ github.token }}
          merge-multiple: true
          digest-mismatch: error
      - name: Install the existing pinned browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/startup-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/startup-browser-tools/node_modules/.bin/playwright" install-deps chromium
          google-chrome --version
          node tests/test_startup_trace_hooks.js
          node tests/test_startup_memory_report.js
      - name: Compare cold and warm fresh cafes in symmetric order
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/startup-browser-tools/node_modules/playwright
        run: |
          set -euo pipefail
          for trial in baseline-1 candidate-1 candidate-2 baseline-2; do
            source=candidate-source; product=candidate
            if [[ "$trial" == baseline-* ]]; then source=baseline; product=baseline; fi
            xvfb-run -a node tests/startup_timing_browser.js --source-root "$source" --web-build "$RUNNER_TEMP/$product-web" --output "$RUNNER_TEMP/startup-browser-compare/$trial"
          done
      - name: Separately attribute both products without mixing trace overhead into timing
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/startup-browser-tools/node_modules/playwright
        run: |
          set -euo pipefail
          xvfb-run -a node tests/startup_trace_browser.js --source-root baseline --web-build "$RUNNER_TEMP/baseline-web" --output "$RUNNER_TEMP/startup-browser-compare/baseline-trace"
          xvfb-run -a node tests/startup_trace_browser.js --source-root candidate-source --web-build "$RUNNER_TEMP/candidate-web" --output "$RUNNER_TEMP/startup-browser-compare/candidate-trace"
      - name: Retain source-bound timing, graphics identity and attribution traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-diagnostic-only-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/startup-browser-compare/
          if-no-files-found: error
          retention-days: 7
