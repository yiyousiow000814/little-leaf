<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Little Leaf Cafe</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background: #cce3e8;
}

body {
	color: #735f43;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	overflow: hidden;
}

#canvas { display: block; touch-action: none; }
#canvas:focus { outline: none; }

/* This is visible before any engine, SDK or storage work can begin. */
#status {
	position: fixed;
	inset: 0;
	z-index: 10;
	background: #cce3e8;
	overflow: auto;
	touch-action: pan-y;
}

.status-cloud {
	position: absolute;
	width: 64px;
	height: 64px;
	border-radius: 50%;
	background: rgba(255, 255, 250, .42);
	transform: translate(-50%, -50%);
}
.status-cloud::before, .status-cloud::after {
	content: '';
	position: absolute;
	border-radius: 50%;
	background: inherit;
}
.status-cloud::before { width: 46px; height: 46px; left: -17px; top: 13px; }
.status-cloud::after { width: 50px; height: 50px; left: 37px; top: 13px; }
.status-cloud:nth-child(1) { left: 16%; top: 18%; }
.status-cloud:nth-child(2) { left: 78%; top: 23%; }
.status-cloud:nth-child(3) { left: 60%; top: 68%; }

/* Match cafe_intro.gd's opening composition, including short landscapes. */
#status-brand {
	position: absolute;
	left: 50%;
	top: 42.8%;
	width: min(91.7937vw, 620px, 90.695vh);
	aspect-ratio: 783 / 518;
	transform: translate(-50%, -50%);
	text-align: center;
}
#status-welcome {
	position: absolute;
	left: 50%;
	top: -18px;
	transform: translateX(-50%);
	width: 100vw;
	margin: 0;
	font-size: 24px;
	font-weight: 700;
	line-height: 34px;
}
#status-splash { display: block; width: 100%; height: 100%; object-fit: contain; }
#status-brand-fallback {
	position: absolute;
	inset: 0;
	display: grid;
	place-content: center;
	font: bold clamp(32px, 8vw, 64px) Georgia, serif;
}
#status-brand-fallback[hidden], #status-splash[hidden] { display: none; }

#status-loading {
	position: absolute;
	left: 50%;
	bottom: 9%;
	transform: translateX(-50%);
	width: min(70vw, 320px);
	text-align: center;
}
#status-label { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
#status-progress {
	display: block;
	width: 100%;
	height: 12px;
	box-sizing: border-box;
	appearance: none;
	-webkit-appearance: none;
	border: 1px solid #899b72;
	border-radius: 999px;
	background: #f6f3df;
	color: #708749;
	accent-color: #708749;
	overflow: hidden;
}
#status-progress::-webkit-progress-bar { background: #f6f3df; border-radius: 999px; }
#status-progress::-webkit-progress-value { background: #708749; border-radius: 999px; }
#status-progress::-moz-progress-bar { background: #708749; border-radius: 999px; }
/* Unknown totals have no invented percentage or time-based advancement. */
#status-progress:indeterminate { opacity: .65; }

#status-notice {
	display: none;
	position: relative;
	z-index: 1;
	box-sizing: border-box;
	width: min(90%, 540px);
	max-height: 80%;
	overflow: auto;
	margin: 10vh auto;
	padding: 24px;
	border: 1px solid #907853;
	border-radius: 16px;
	background: #fff9e9;
	color: #56442f;
	line-height: 1.5;
	text-align: center;
	touch-action: pan-y;
}
#status-notice h1 { font-size: 22px; margin: 0 0 12px; }
#status-error { white-space: pre-wrap; overflow-wrap: anywhere; }
#status-retry {
	min-height: 44px;
	padding: 10px 24px;
	border: 1px solid #596c3b;
	border-radius: 12px;
	background: #708749;
	color: white;
	font: inherit;
	cursor: pointer;
}
#status-retry:focus-visible { outline: 3px solid #735f43; outline-offset: 4px; }
#status[data-mode="notice"] #status-brand,
#status[data-mode="notice"] #status-loading { display: none; }
#status[data-mode="notice"] #status-notice { display: block; }
#no-script {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: grid;
	place-content: center;
	padding: 24px;
	background: #cce3e8;
	text-align: center;
	line-height: 1.5;
}
@media (prefers-reduced-motion: reduce) {
	#status-progress:indeterminate { visibility: hidden; }
}
@media (max-width: 699px) { #status-welcome { font-size: 18px; } }
@media (max-height: 340px) {
	#status-loading { bottom: 5%; }
	#status-label { font-size: 12px; margin-bottom: 6px; }
}

			</section>
		</div>

/* Little Leaf boot presentation only. No storage, gameplay, audio or SDK state. */
(function (root) {
	'use strict';
	const overlay = document.getElementById('status');
	const label = document.getElementById('status-label');
	const progress = document.getElementById('status-progress');
	const splash = document.getElementById('status-splash');
	const canvas = document.getElementById('canvas');
	let engineReady = false, frameReady = false, finished = false;
	let frameWatchdog = null;
	function stopWatching() {
		root.clearTimeout(frameWatchdog);
		document.removeEventListener('visibilitychange', watchForFrame);
	}
	function watchForFrame() {
		root.clearTimeout(frameWatchdog);
		// This is a failure diagnostic, never a minimum splash duration. Hidden
		// tabs cannot render reliably, so allow a fresh visible observation window.
		if (finished || frameReady || !engineReady || document.visibilityState === 'hidden') return;
		frameWatchdog = root.setTimeout(() => fail('The café has not drawn its first frame yet. Reload to try again.'), 45000);
	}
	document.addEventListener('visibilitychange', watchForFrame);

	function revealGame() {
		if (finished || !engineReady || !frameReady) return;
		finished = true;
		stopWatching();
		canvas.setAttribute('aria-busy', 'false');
		overlay.remove();
	}
	function fail(error) {
		if (finished) return;
		finished = true;
		stopWatching();
		console.error(error);
		const message = typeof error === 'string' ? error : error && error.message;
		document.getElementById('status-error').textContent = message || 'The game could not finish starting. Please reload to try again.';
		overlay.dataset.mode = 'notice';
		canvas.setAttribute('aria-busy', 'false');
		document.getElementById('status-retry').focus();
	}
	function showBrandFallback() {
		splash.hidden = true;
		document.getElementById('status-brand-fallback').hidden = false;
	}
	splash.addEventListener('error', showBrandFallback);
	if (splash.complete && !splash.naturalWidth) showBrandFallback();
	document.getElementById('status-retry').addEventListener('click', () => root.location.reload());
	root.LittleLeafBoot = Object.freeze({
		fail,
		onProgress(current, total) {
			if (finished) return;
			if (Number.isFinite(current) && Number.isFinite(total) && current >= 0 && total > 0 && current <= total) {
				progress.max = total;
				progress.value = current;
				label.textContent = current < total ? 'Downloading your café…' : 'Opening your café…';
			} else {
				progress.removeAttribute('value');
				progress.removeAttribute('max');
				label.textContent = 'Downloading your café…';
			}
		},
		artWarmup(ready, total) {
			if (finished || !Number.isInteger(ready) || !Number.isInteger(total) || total <= 0 || ready < 0 || ready > total) return;
			label.textContent = `Preparing café art · ${ready}/${total} ready`;
			progress.removeAttribute('value');
			progress.removeAttribute('max');
		},
		engineReady() {
			if (finished) return;
			engineReady = true;
			watchForFrame();
			progress.setAttribute('aria-label', 'Opening Little Leaf');
			label.textContent = 'Opening your café…';
			// Download completion is not a first rendered frame. Do not uncover the
			// engine splash or an empty canvas, even on a fast/cache-hit launch.
			progress.removeAttribute('value');
			progress.removeAttribute('max');
			revealGame();
		},
		// Called once by main.gd after RenderingServer.frame_post_draw.
		firstFrameReady() { frameReady = true; revealGame(); }
	});
})(window);
